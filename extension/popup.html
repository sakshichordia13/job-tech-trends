<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job Tech Analyzer</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        font-family: Arial, sans-serif;
        margin: 12px;
        min-width: 320px;
        color: #111;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      button {
        padding: 8px 10px;
        border: 1px solid #222;
        background: #f2f2f2;
        cursor: pointer;
        font-size: 13px;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #status {
        margin: 8px 0;
        font-size: 12px;
        color: #444;
      }
      #backendMsg {
        margin: 4px 0 8px;
        font-size: 12px;
        color: #8a3b00;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .section-title {
        margin-top: 10px;
        font-size: 12px;
        font-weight: 600;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
        font-size: 12px;
      }
      th,
      td {
        border-bottom: 1px solid #e3e3e3;
        text-align: left;
        padding: 4px 0;
      }
      th {
        font-weight: 600;
      }
      .empty {
        color: #777;
        font-size: 12px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Job Tech Analyzer</h1>
    <div class="actions">
      <button id="analyzeBtn">Analyze this job</button>
      <button id="trendingBtn">Trending</button>
    </div>
    <div id="status"></div>
    <div id="source" class="empty"></div>
    <div id="backendMsg"></div>
    <div id="results"></div>
    <div class="section-title">Trending (last 7 days)</div>
    <div id="trendingStatus" class="empty"></div>
    <div id="trendingResults"></div>
    <script src="popup.js"></script>
  </body>
</html>
